name: Radar CGR - recoleccion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radar_cgr/**"
      - "config/**"
      - "schemas/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "run.py"
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "17 10,22 * * *"

permissions:
  contents: write

concurrency:
  group: radar-cgr-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Pruebas
        run: pytest -q
      - name: Ejecutar Radar CGR
        env:
          TZ: America/Santiago
        run: python run.py
      - name: Persistir cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radar-cgr-bot"
          git config user.email "radar-cgr-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios de datos"
            exit 0
          fi
          git commit -m "radar: actualizacion automatica $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin main
          git push origin HEAD:main
