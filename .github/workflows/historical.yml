# v0.3.5 - barrido exhaustivo incremental y validado contra CGR
name: Radar CGR - barrido historico

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Cantidad maxima de informes CGR a validar/procesar en esta corrida"
        required: false
        default: "120"
      months_per_run:
        description: "Meses pendientes a recorrer en el buscador oficial CGR"
        required: false
        default: "24"
      max_collections:
        description: "Colecciones Common Crawl pendientes; 0 = todas"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "radar_cgr/history.py"
      - "radar_cgr/official_search.py"
      - "radar_cgr/commoncrawl_discovery.py"
      - "radar_cgr/coverage.py"
      - "radar_cgr/temporality.py"
      - "radar_cgr/storage.py"
      - "config/historical_sources.json"
      - "requirements-historical.txt"
      - "tests/test_history.py"
      - "tests/test_commoncrawl.py"
      - "tests/test_official_search.py"
      - "tests/test_temporality.py"
      - ".github/workflows/historical.yml"
  schedule:
    - cron: "41 4,16 * * *"

permissions:
  contents: write

concurrency:
  group: radar-cgr-write-v2
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '120' }}
      MONTHS_PER_RUN: ${{ github.event.inputs.months_per_run || '24' }}
      MAX_COLLECTIONS: ${{ github.event.inputs.max_collections || '0' }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias históricas
        run: |
          pip install -r requirements-historical.txt
          python -m playwright install --with-deps chromium
      - name: Pruebas
        run: pytest -q
      - name: Descubrir informes con el buscador oficial CGR
        env:
          TZ: America/Santiago
        run: python -m radar_cgr.official_search --start-year 2009 --months-per-run "$MONTHS_PER_RUN" --max-pages 200
      - name: Descubrir docIdcm en índices web históricos complementarios
        env:
          TZ: America/Santiago
        run: python -m radar_cgr.commoncrawl_discovery --min-year 2013 --max-year 2026 --max-pages-per-query 200 --page-size 5 --max-collections "$MAX_COLLECTIONS"
      - name: Validar contra CGR y estructurar cola histórica
        env:
          TZ: America/Santiago
        run: python -m radar_cgr.history --batch-size "$BATCH_SIZE" --max-pages 0 --max-articles 0
      - name: Persistir cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radar-cgr-bot"
          git config user.email "radar-cgr-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios historicos"
            exit 0
          fi
          git commit -m "radar: backfill historico $(date -u +'%Y-%m-%dT%H:%MZ')"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ] && [ "$(git rev-parse HEAD~1)" != "$(git rev-parse origin/main)" ]; then
            echo "main cambió durante la corrida; regenerar en próxima ejecución"
            exit 1
          fi
          git push origin HEAD:main
