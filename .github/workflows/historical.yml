name: Radar CGR - barrido historico

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Cantidad maxima de informes CGR a validar/procesar en esta corrida"
        required: false
        default: "250"
      max_collections:
        description: "Colecciones históricas pendientes a escanear; 0 = todas"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "radar_cgr/history.py"
      - "radar_cgr/commoncrawl_discovery.py"
      - "radar_cgr/coverage.py"
      - "radar_cgr/temporality.py"
      - "radar_cgr/storage.py"
      - "config/historical_sources.json"
      - "tests/test_history.py"
      - "tests/test_commoncrawl.py"
      - "tests/test_temporality.py"
      - ".github/workflows/historical.yml"
  schedule:
    - cron: "41 4,16 * * *"

permissions:
  contents: write

concurrency:
  group: radar-cgr-data
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '250' }}
      MAX_COLLECTIONS: ${{ github.event.inputs.max_collections || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Pruebas
        run: pytest -q
      - name: Descubrir docIdcm en todas las colecciones históricas pendientes
        env:
          TZ: America/Santiago
        run: python -m radar_cgr.commoncrawl_discovery --min-year 2013 --max-year 2026 --max-pages-per-query 200 --page-size 5 --max-collections "$MAX_COLLECTIONS"
      - name: Validar contra CGR y estructurar cola histórica
        env:
          TZ: America/Santiago
        run: python -m radar_cgr.history --batch-size "$BATCH_SIZE" --max-pages 0 --max-articles 0
      - name: Persistir cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radar-cgr-bot"
          git config user.email "radar-cgr-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios historicos"
            exit 0
          fi
          git commit -m "radar: backfill historico $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "No fue posible persistir el backfill tras 3 intentos"
          exit 1
